name: Playwright CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  # =========================================================
  # 🔍 CODE QUALITY
  # =========================================================
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type Check
        run: npx tsc --noEmit

      - name: Dependency Audit
        run: npm audit --audit-level=high || true


  # =========================================================
  # 🔐 SECURITY SCAN
  # =========================================================
  security:
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3


  # =========================================================
  # 🧪 SHARDED PLAYWRIGHT TESTS
  # =========================================================
  test:
    runs-on: ubuntu-latest
    needs: security

    strategy:
      fail-fast: false

      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip3 install pandas

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ✅ FIX 2
      # shard env defined BEFORE Playwright config evaluation
      - name: Run Playwright tests (sharded)
        env:
          PW_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          npx playwright test --shard=${{ matrix.shard }}/4

      # ✅ FIX 5
      # upload shard-specific reports INCLUDING blob-report
      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}

          path: |
            blob-report/
            playwright-report-${{ matrix.shard }}/
            test-results/
            results/

          retention-days: 7


  # =========================================================
  # 🚦 QUALITY GATE + REPORT MERGE
  # =========================================================
  quality-gate:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # -----------------------------------------------------
      # Download all shard artifacts
      # -----------------------------------------------------
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------
      # Debug artifact structure
      # -----------------------------------------------------
      - name: Debug downloaded reports
        run: |
          echo "==== DOWNLOADED REPORTS ===="
          ls -R reports

      # -----------------------------------------------------
      # ✅ FIX 6
      # Merge Playwright blob reports
      # -----------------------------------------------------
      - name: Merge Playwright reports
        run: |
          find reports -type d -name "blob-report-*" || true
          npx playwright merge-reports --reporter html reports

      # -----------------------------------------------------
      # Verify merged report exists
      # -----------------------------------------------------
      - name: Ensure merged Playwright report exists
        run: |
          ls -R playwright-report || echo "No merged report found"

      # -----------------------------------------------------
      # Run AI Quality Gate
      # -----------------------------------------------------
      - name: Run Quality Gate
        run: |
          npx ts-node scripts/quality-gate.ts reports

      # -----------------------------------------------------
      # Upload merged report
      # -----------------------------------------------------
      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-report

          path: |
            playwright-report/
            reports/

          retention-days: 14

      # -----------------------------------------------------
      # Upload execution summary
      # -----------------------------------------------------
      - name: Upload execution summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-summary

          # ⚠️ your script MUST generate this file
          path: |
            reports/execution-summary.json

          if-no-files-found: warn

      # -----------------------------------------------------
      # GitHub summary
      # -----------------------------------------------------
      - name: Publish execution summary
        if: always()
        run: |
          echo "## 📊 Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FILE=$(find reports -name "execution-summary.json" | head -n 1)

          if [ -f "$FILE" ]; then
            cat "$FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "No execution summary found" >> $GITHUB_STEP_SUMMARY
          fi

      # -----------------------------------------------------
      # Detailed failure report
      # -----------------------------------------------------
      - name: Publish detailed failure report
        if: always()
        run: |
          echo "## 🔍 Detailed Failure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FILE=$(find reports -name "execution-summary.json" | head -n 1)

          if [ -f "$FILE" ]; then
            cat "$FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "No detailed report found" >> $GITHUB_STEP_SUMMARY
          fi

      # -----------------------------------------------------
      # Final debug
      # -----------------------------------------------------
      - name: Final report structure
        if: always()
        run: |
          echo "==== FINAL REPORT STRUCTURE ===="
          ls -R