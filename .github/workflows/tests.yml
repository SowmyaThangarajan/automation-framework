name: Playwright CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CI: true

jobs:

  # =========================================================
  # 🔍 CODE QUALITY
  # =========================================================
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Lint
        run: npm run lint || true

      - name: Type Check
        run: npx tsc --noEmit

      - name: Dependency Audit
        run: npm audit --audit-level=high || true


  # =========================================================
  # 🔐 SECURITY SCAN
  # =========================================================
  security:
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3


  # =========================================================
  # 🧪 PLAYWRIGHT TEST EXECUTION (SHARDED)
  # =========================================================
  test:
    runs-on: ubuntu-latest
    needs: security

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # =====================================================
      # RUN TESTS
      # =====================================================
      - name: Run Playwright Tests
        env:
          PW_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          npx playwright test --shard=${{ matrix.shard }}/4

      # =====================================================
      # VERIFY GENERATED REPORTS
      # =====================================================
      - name: Verify Generated Reports
        if: always()
        run: |
          echo "================================================="
          echo "PLAYWRIGHT REPORTS"
          echo "================================================="
          find . -type d -name "playwright-report*"

          echo ""
          echo "================================================="
          echo "BLOB REPORTS"
          echo "================================================="
          find . -type d -name "blob-report*"

          echo ""
          echo "================================================="
          echo "BLOB ZIP FILES"
          echo "================================================="
          find . -name "*.zip"

          echo ""
          echo "================================================="
          echo "RESULT FILES"
          echo "================================================="
          find results -type f || true

      # =====================================================
      # UPLOAD SHARD ARTIFACTS
      # =====================================================
      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            blob-report/
            playwright-report-*/
            results/
          if-no-files-found: warn


  # =========================================================
  # 🚦 QUALITY GATE + AI ANALYSIS
  # =========================================================
  quality-gate:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:

      # =====================================================
      # DOWNLOAD REPORTS
      # =====================================================
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      # =====================================================
      # DEBUG DOWNLOADED REPORTS
      # =====================================================
      - name: Debug Downloaded Reports
        run: |
          echo "================================================="
          echo "DIRECTORY STRUCTURE"
          echo "================================================="
          find reports -maxdepth 6 -type d

          echo ""
          echo "================================================="
          echo "FILES"
          echo "================================================="
          find reports -type f

      # =====================================================
      # PREPARE BLOB REPORTS
      # =====================================================
      - name: Prepare Blob Reports
        run: |
          mkdir -p all-blob-reports

          find reports -type d -name "blob-report*" -exec cp -r {}/* all-blob-reports/ \;

          echo "=== CHECK ZIP FILES ==="
          find all-blob-reports -type f

      # =====================================================
      # VERIFY ZIP FILES
      # =====================================================
      - name: Verify Blob ZIP Files
        run: |
          echo "================================================="
          echo "ZIP FILES"
          echo "================================================="
          find all-blob-reports -name "*.zip"

      # =====================================================
      # MERGE PLAYWRIGHT REPORTS
      # =====================================================
      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports \
            --reporter html \
            all-blob-reports

      # =====================================================
      # VERIFY MERGED REPORT
      # =====================================================
      - name: Verify Merged Report
        run: |
          echo "================================================="
          echo "MERGED PLAYWRIGHT REPORT"
          echo "================================================="
          ls -R playwright-report || true

      # =====================================================
      # GENERATE AI BUG REPORT
      # =====================================================
      - name: Generate AI Bug Report
        run: |
          mkdir -p reports/ai
          npx ts-node utils/processReports.ts reports

      # =====================================================
      # GENERATE EXECUTION SUMMARY
      # =====================================================
      - name: Generate Execution Summary
        run: |
          mkdir -p reports

          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const summary = {
            generatedAt: new Date().toISOString(),
            totalPassed: 0,
            totalFailed: 0,
            totalSkipped: 0,
            reportFiles: []
          };

          function scan(dir) {
            if (!fs.existsSync(dir)) return;

            const items = fs.readdirSync(dir, { withFileTypes: true });

            for (const item of items) {
              const fullPath = path.join(dir, item.name);

              if (item.isDirectory()) {
                scan(fullPath);
              } else if (
                item.name.endsWith('.json') &&
                item.name.includes('results-')
              ) {
                try {
                  const data = JSON.parse(
                    fs.readFileSync(fullPath, 'utf8')
                  );

                  summary.reportFiles.push(fullPath);

                  if (data.stats) {
                    summary.totalPassed += data.stats.expected || 0;
                    summary.totalFailed += data.stats.unexpected || 0;
                    summary.totalSkipped += data.stats.skipped || 0;
                  }

                } catch (err) {
                  console.log('Failed parsing:', fullPath);
                }
              }
            }
          }

          scan('reports');

          fs.writeFileSync(
            'reports/execution-summary.json',
            JSON.stringify(summary, null, 2)
          );

          console.log('Execution summary generated');
          console.log(summary);
          EOF

      # =====================================================
      # VERIFY GENERATED REPORTS
      # =====================================================
      - name: Verify Final Reports
        run: |
          echo "================================================="
          echo "AI REPORT"
          echo "================================================="
          ls -R reports/ai || true

          echo ""
          echo "================================================="
          echo "EXECUTION SUMMARY"
          echo "================================================="
          cat reports/execution-summary.json || true

      # =====================================================
      # PUBLISH AI BUG REPORT
      # =====================================================
      - name: Publish AI Summary
        if: always()
        run: |
          echo "## 🤖 AI Bug Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f reports/ai/bug-report.json ]; then
            cat reports/ai/bug-report.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No AI bug report generated" >> $GITHUB_STEP_SUMMARY
          fi

      # =====================================================
      # PUBLISH EXECUTION SUMMARY
      # =====================================================
      - name: Publish Execution Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f reports/execution-summary.json ]; then
            cat reports/execution-summary.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No execution summary generated" >> $GITHUB_STEP_SUMMARY
          fi

      # =====================================================
      # UPLOAD PLAYWRIGHT HTML REPORT
      # =====================================================
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: warn

      # =====================================================
      # UPLOAD AI BUG REPORT
      # =====================================================
      - name: Upload AI Bug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-bug-report
          path: reports/ai/bug-report.json
          if-no-files-found: warn

      # =====================================================
      # UPLOAD EXECUTION SUMMARY
      # =====================================================
      - name: Upload Execution Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-summary
          path: reports/execution-summary.json
          if-no-files-found: warn