name: Playwright CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


jobs:

# 🔍 CODE QUALITY
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type Check
        run: npx tsc --noEmit

      - name: Dependency Audit
        run: npm audit --audit-level=high || true


# 🔐 SECURITY
  security:
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3


# 🧪 TEST EXECUTION (SHARDED)
  test:
    runs-on: ubuntu-latest
    needs: security

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ▶ Run tests
      - name: Run Playwright tests (sharded)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      # 📦 Upload shard results
      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            playwright-report-*/
            results/
            blob-report-*/


# 🚦 QUALITY GATE + AI ANALYSIS
  quality-gate:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:

      # 📥 Download all shard outputs
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci


      # 🔍 Debug structure
      - name: Debug reports
        run: |
          echo "==== REPORT STRUCTURE ===="
          find reports -maxdepth 4 -type d
          echo ""
          echo "==== FILES ===="
          find reports -type f


      # 🧪 Merge Playwright reports
      - name: Merge Playwright Reports
        run: npx playwright merge-reports --reporter html reports || true


      # 🤖 GENERATE AI BUG REPORT
      - name: Generate AI Bug Report
        run: npx ts-node scripts/generate-bug-report.ts


      # 📊 Publish GitHub Summary (AI OUTPUT)
      - name: Publish AI Bug Report
        if: always()
        run: |
          echo "## 🤖 AI Bug Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f reports/bug-report.json ]; then
            node -e "
              const r = require('./reports/bug-report.json');

              console.log('Total Failures:', r.totalFailures);
              console.log('Generated:', r.generatedAt);

              for (const b of r.bugs) {
                console.log('\n---');
                console.log('Title:', b.bugTitle);
                console.log('Type:', b.ai.type);
                console.log('Severity:', b.severity);
                console.log('Reason:', b.ai.reason);
              }
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No bug report generated" >> $GITHUB_STEP_SUMMARY
          fi


      # 📦 Upload final artifacts
      - name: Upload Full Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-report
          path: |
            playwright-report/
            reports/
          if-no-files-found: warn


      # 📄 Upload AI bug report
      - name: Upload Bug Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-bug-report
          path: reports/bug-report.json
          if-no-files-found: warn