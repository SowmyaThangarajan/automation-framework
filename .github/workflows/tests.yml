name: Playwright CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  # 🔍 Code Quality
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type Check
        run: npx tsc --noEmit

      - name: Dependency Audit
        run: npm audit --audit-level=high || true


  # 🔐 Security Scan
  security:
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3


  # 🧪 Parallel Playwright Tests
  test:
    runs-on: ubuntu-latest
    needs: security

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip3 install pandas

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ✅ Run shard
      - name: Run Playwright tests (sharded)
        env:
          PW_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          npx playwright test --shard=${{ matrix.shard }}/4

      # ✅ Verify blob reports exist
      - name: Debug generated files
        if: always()
        run: |
          echo "==== GENERATED FILES ===="
          find . -maxdepth 3 -type d
          echo ""
          echo "==== ZIP FILES ===="
          find . -name "*.zip"

      # ✅ Upload ALL artifacts
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            blob-report-${{ matrix.shard }}/**
            playwright-report-${{ matrix.shard }}/**
            results/**
          if-no-files-found: warn


  # 🚦 Quality Gate + Merge Reports
  quality-gate:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      # ✅ Download shard artifacts
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # ✅ Debug downloaded artifacts
      - name: Debug downloaded artifacts
        run: |
          echo "==== DOWNLOADED REPORTS ===="
          find reports -type d
          echo ""
          echo "==== DOWNLOADED FILES ===="
          find reports -type f

      # ✅ Verify blob reports exist
      - name: Verify blob reports
        run: |
          echo "==== BLOB REPORTS ===="
          find reports -type d -name "blob-report-*"

          echo ""
          echo "==== BLOB ZIP FILES ===="
          find reports -name "*.zip"

      # ✅ Merge shard blob reports
      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports --reporter html reports

      # ✅ Verify merged report
      - name: Ensure merged report exists
        run: |
          echo "==== MERGED REPORT ===="
          ls -R playwright-report || echo "No merged report found"

      # 📊 Run quality gate
      - name: Run Quality Gate
        run: |
          npx ts-node scripts/quality-gate.ts reports

      # 📦 Upload merged report
      - name: Upload Full Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-report
          path: |
            playwright-report/
            reports/
          if-no-files-found: warn

      # 📄 Upload execution summary
      - name: Upload Execution Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-summary
          path: reports/execution-summary.json
          if-no-files-found: warn

      # 📢 Publish execution summary
      - name: Publish Execution Summary
        if: always()
        run: |
          echo "## 📊 Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FILE=$(find reports -name "execution-summary.json" | head -n 1)

          if [ -f "$FILE" ]; then
            cat "$FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "No execution summary found" >> $GITHUB_STEP_SUMMARY
          fi

      # 🔍 Detailed report
      - name: Publish Detailed Failure Report
        if: always()
        run: |
          echo "## 🔍 Detailed Failure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FILE=$(find reports -name "execution-summary.json" | head -n 1)

          if [ -f "$FILE" ]; then
            cat "$FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "No detailed report found" >> $GITHUB_STEP_SUMMARY
          fi